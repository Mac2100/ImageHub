name: Build

on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a GitHub Release (tagged v<app version>) from this run"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  # wimlib-imagex is bundled so splitting an oversized install.wim needs no
  # Homebrew on the Mac that builds drives. Built natively per architecture and
  # lipo'd below — cross-compiling autotools projects on macOS is far more
  # fragile than using one runner per arch.
  wimlib:
    name: Build wimlib (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            arch: arm64
          - runner: macos-13
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install autotools
        run: brew install autoconf automake libtool pkg-config

      - name: Build
        run: ./scripts/build_wimlib.sh "$RUNNER_TEMP/wimlib"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: wimlib-${{ matrix.arch }}
          path: ${{ runner.temp }}/wimlib/
          if-no-files-found: error

  build:
    name: Build macOS app + DMG
    runs-on: macos-14
    needs: [wimlib]
    # A wimlib failure must not block the app: it falls back to finding
    # Homebrew's copy at runtime, so the release still ships.
    if: always()
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Download wimlib (arm64)
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: wimlib-arm64
          path: wimlib-arm64

      - name: Download wimlib (x86_64)
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: wimlib-x86_64
          path: wimlib-x86_64

      - name: Stage a universal wimlib
        run: |
          set -euo pipefail
          arm="wimlib-arm64/wimlib-imagex-arm64"
          intel="wimlib-x86_64/wimlib-imagex-x86_64"
          mkdir -p vendor/bin vendor/wimlib

          if [ -f "$arm" ] && [ -f "$intel" ]; then
            lipo -create "$arm" "$intel" -output vendor/bin/wimlib-imagex
          elif [ -f "$arm" ]; then
            echo "::warning::Only the arm64 wimlib built; Intel Macs will fall back to Homebrew."
            cp "$arm" vendor/bin/wimlib-imagex
          elif [ -f "$intel" ]; then
            echo "::warning::Only the x86_64 wimlib built; Apple Silicon will fall back to Homebrew."
            cp "$intel" vendor/bin/wimlib-imagex
          else
            echo "::warning::No wimlib binary available; the app will look for Homebrew's copy."
            exit 0
          fi

          chmod +x vendor/bin/wimlib-imagex
          lipo -info vendor/bin/wimlib-imagex
          cp wimlib-arm64/COPYING vendor/wimlib/COPYING 2>/dev/null \
            || cp wimlib-x86_64/COPYING vendor/wimlib/COPYING 2>/dev/null || true
          cp wimlib-arm64/VERSION vendor/wimlib/VERSION 2>/dev/null \
            || cp wimlib-x86_64/VERSION vendor/wimlib/VERSION 2>/dev/null || true

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Check the provisioning scripts parse
        run: |
          # PowerShell isn't needed to build the app, but a syntax error in the
          # payload would only surface on a technician's machine at 2am.
          if command -v pwsh >/dev/null 2>&1; then
            pwsh -NoProfile -Command '
              $ErrorActionPreference = "Stop"
              foreach ($file in Get-ChildItem -Recurse -Filter *.ps1 -Path Shared, Windows) {
                $errors = $null
                [System.Management.Automation.Language.Parser]::ParseFile(
                  $file.FullName, [ref]$null, [ref]$errors) | Out-Null
                if ($errors) {
                  Write-Host "::error file=$($file.FullName)::$($errors[0].Message)"
                  exit 1
                }
                Write-Host "ok: $($file.Name)"
              }'
          else
            echo "pwsh not available on this runner; skipping the PowerShell parse check."
          fi

      - name: Build app, zip, and DMG
        run: ./scripts/make_app.sh

      - name: Verify the generated answer file and payload config
        run: |
          set -euo pipefail
          BIN="dist/ImageHub.app/Contents/MacOS/ImageHub"

          # autounattend.xml is the artifact with the least margin for error —
          # a malformed one fails on a technician's bench, not here.
          "$BIN" --emit-answer-file > /tmp/autounattend.xml
          xmllint --noout /tmp/autounattend.xml
          echo "answer file is well-formed ($(wc -c < /tmp/autounattend.xml) bytes)"

          # Every pass Setup reads must be present, or the drive boots and then
          # sits waiting for a human.
          for pass in windowsPE specialize oobeSystem; do
            grep -q "pass=\"${pass}\"" /tmp/autounattend.xml \
              || { echo "::error::answer file is missing the ${pass} pass"; exit 1; }
          done
          grep -q "ImageHub\\\\Provision.ps1" /tmp/autounattend.xml \
            || { echo "::error::answer file never launches Provision.ps1"; exit 1; }

          # The payload config is what Provision.ps1 parses.
          "$BIN" --emit-payload-config > /tmp/config.json
          python3 -c "import json,sys; json.load(open('/tmp/config.json'))"
          echo "payload config is valid JSON"

      - name: Read app version
        id: version
        run: |
          version=$(sed -n 's/.*marketing = "\([^"]*\)".*/\1/p' Sources/ImageHub/Support/AppVersion.swift)
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: ImageHub-dmg
          path: dist/*.dmg
          if-no-files-found: error

      - name: Upload app bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: ImageHub-app-universal
          path: dist/*.zip
          if-no-files-found: error

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release)
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dmg
            dist/*.zip
          generate_release_notes: true
          # On tag pushes, release under that tag; on manual dispatch, create
          # the tag v<app version> at the built commit.
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', steps.version.outputs.version) }}
