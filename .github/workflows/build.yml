name: Build

on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a GitHub Release (tagged v<app version>) from this run"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  # wimlib-imagex is bundled so splitting an oversized install.wim needs no
  # Homebrew on the Mac that builds drives.
  #
  # One job on one runner, deliberately. The obvious shape — a matrix with an
  # Intel runner for x86_64 — does not work any more: macos-13 sits queued
  # indefinitely, `timeout-minutes` only starts counting once a job gets a
  # runner, and the app build waits behind it. So arm64 is built natively and
  # x86_64 is cross-compiled here, with cross-compilation allowed to fail.
  wimlib:
    name: Build wimlib
    runs-on: macos-14
    timeout-minutes: 25
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install autotools
        run: brew install autoconf automake libtool pkg-config

      - name: Build for arm64
        run: ./scripts/build_wimlib.sh "$RUNNER_TEMP/wimlib" arm64

      - name: Build for x86_64
        id: intel
        continue-on-error: true
        run: ./scripts/build_wimlib.sh "$RUNNER_TEMP/wimlib" x86_64

      - name: Note a missing Intel slice
        if: steps.intel.outcome != 'success'
        run: echo "::warning::x86_64 cross-compile failed; Intel Macs will fall back to Homebrew."

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: wimlib
          path: ${{ runner.temp }}/wimlib/
          if-no-files-found: error

  build:
    name: Build macOS app + DMG
    runs-on: macos-14
    needs: [wimlib]
    # A wimlib failure must not block the app: it falls back to finding
    # Homebrew's copy at runtime, so the release still ships.
    if: always()
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Download wimlib
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: wimlib
          path: wimlib

      - name: Stage wimlib into the bundle
        run: |
          set -euo pipefail
          arm="wimlib/wimlib-imagex-arm64"
          intel="wimlib/wimlib-imagex-x86_64"
          mkdir -p vendor/bin vendor/wimlib

          if [ -f "$arm" ] && [ -f "$intel" ]; then
            lipo -create "$arm" "$intel" -output vendor/bin/wimlib-imagex
          elif [ -f "$arm" ]; then
            echo "::warning::arm64 wimlib only; Intel Macs will fall back to Homebrew."
            cp "$arm" vendor/bin/wimlib-imagex
          elif [ -f "$intel" ]; then
            echo "::warning::x86_64 wimlib only; Apple Silicon will fall back to Homebrew."
            cp "$intel" vendor/bin/wimlib-imagex
          else
            echo "::warning::No wimlib binary available; the app will look for Homebrew's copy."
            exit 0
          fi

          chmod +x vendor/bin/wimlib-imagex
          lipo -info vendor/bin/wimlib-imagex
          cp wimlib/COPYING vendor/wimlib/COPYING 2>/dev/null || true
          cp wimlib/VERSION vendor/wimlib/VERSION 2>/dev/null || true

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Check the provisioning scripts
        run: |
          set -euo pipefail

          # Windows PowerShell 5.1 -- which is what actually runs Provision.ps1 on
          # a target machine -- decodes a BOM-less file as Windows-1252, not UTF-8.
          # An em dash (E2 80 94) then becomes three CP1252 characters, the last of
          # which is a curly closing quote, and PowerShell treats curly quotes as
          # string delimiters. That opened a phantom string, swallowed the braces,
          # and produced "Missing closing '}'" on a script that parses perfectly
          # under PowerShell 7. Requiring a BOM *and* plain ASCII closes both
          # halves of that trap. This check needs no PowerShell, so it always runs.
          fail=0
          for f in Shared/payload/*.ps1 Windows/*.ps1; do
            if [ "$(head -c 3 "$f" | od -An -tx1 | tr -d ' \n')" != "efbbbf" ]; then
              echo "::error file=$f::missing UTF-8 BOM; Windows PowerShell 5.1 will decode it as ANSI"
              fail=1
            fi
            # tail -c +4 skips the BOM itself, which is of course non-ASCII.
            if tail -c +4 "$f" | LC_ALL=C grep -qn '[^ -~'"$(printf '\t')"']'; then
              echo "::error file=$f::contains non-ASCII characters"
              tail -c +4 "$f" | LC_ALL=C grep -n '[^ -~'"$(printf '\t')"']' | head -5
              fail=1
            fi
          done
          [ "$fail" -eq 0 ] || exit 1
          echo "all payload scripts are ASCII with a UTF-8 BOM"

      - name: Parse the provisioning scripts
        run: |
          set -euo pipefail
          # The old version of this step was wrapped in `if command -v pwsh`, and
          # pwsh is not on the macOS runners -- so it silently skipped on every
          # build while a syntax error shipped. Install it and fail loudly instead.
          if ! command -v pwsh >/dev/null 2>&1; then
            brew install --quiet powershell/tap/powershell || brew install --quiet --cask powershell
          fi
          pwsh -NoProfile -Command '
            $bad = 0
            foreach ($f in Get-ChildItem -Recurse -Filter *.ps1 -Path Shared, Windows) {
              $errors = $null
              [System.Management.Automation.Language.Parser]::ParseFile(
                $f.FullName, [ref]$null, [ref]$errors) | Out-Null
              if ($errors) {
                Write-Host "::error file=$($f.FullName)::$($errors[0].Message)"
                $bad = 1
              } else { Write-Host "ok: $($f.Name)" }
            }
            exit $bad'

      - name: Build app, zip, and DMG
        run: ./scripts/make_app.sh

      # make_app.sh redraws Resources/icon_1024.png from the SF Symbol the app
      # itself displays. That needs macOS, so it can only happen here — and the
      # README renders that same file straight out of the repo. Push it back when
      # it changes, otherwise the picture in the README is whatever was committed
      # by hand the last time somebody guessed at the shape. The render is
      # deterministic, so this settles after one commit instead of looping.
      - name: Commit the regenerated icon
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        # Never fail a release over the README's picture.
        continue-on-error: true
        run: |
          set -euo pipefail
          if git diff --quiet -- Resources/icon_1024.png; then
            echo "icon is unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Resources/icon_1024.png
          git commit -m "Regenerate the app icon from the in-app symbol"
          git push origin HEAD:main

      - name: Verify the generated answer file and payload config
        run: |
          set -euo pipefail
          BIN="dist/ImageHub.app/Contents/MacOS/ImageHub"

          # autounattend.xml is the artifact with the least margin for error —
          # a malformed one fails on a technician's bench, not here.
          "$BIN" --emit-answer-file > /tmp/autounattend.xml
          xmllint --noout /tmp/autounattend.xml
          echo "answer file is well-formed ($(wc -c < /tmp/autounattend.xml) bytes)"

          # Every pass Setup reads must be present, or the drive boots and then
          # sits waiting for a human.
          for pass in windowsPE specialize oobeSystem; do
            grep -q "pass=\"${pass}\"" /tmp/autounattend.xml \
              || { echo "::error::answer file is missing the ${pass} pass"; exit 1; }
          done
          # Provisioning is launched via Launch.cmd now, not by naming
          # Provision.ps1 in the answer file — the inlined PowerShell was too long
          # for the command string. The helper checks below cover that chain.

          # Element order inside a component is part of the unattend schema, and
          # Setup rejects the entire answer file when it's wrong — it does not
          # skip the offending element. xmllint cannot see this; a well-formed
          # file shipped for weeks with RunSynchronous after UserData, which made
          # every windowsPE pass invalid. Check the sequences we actually emit.
          python3 - <<'PY'
          import sys, xml.etree.ElementTree as ET

          NS = {'u': 'urn:schemas-microsoft-com:unattend'}
          # Schema order for the components we write, in the order Setup expects.
          ORDER = {
              'Microsoft-Windows-Setup': [
                  'ComplianceCheck', 'Diagnostics', 'DiskConfiguration',
                  'DynamicUpdate', 'EnableFirewall', 'EnableNetwork',
                  'ImageInstall', 'LogPath', 'Multivariant', 'Restart',
                  'RunAsynchronous', 'RunSynchronous', 'UpgradeData',
                  'UserData', 'UseConfigurationSet',
                  'WindowsDeploymentServices',
              ],
              # Only this component is checked. International-Core-WinPE is
              # deliberately left out: its canonical form puts SetupUILanguage
              # first rather than alphabetically, so asserting an order here would
              # risk failing CI over something unverified.
          }

          tree = ET.parse('/tmp/autounattend.xml')
          failures = []
          for settings in tree.getroot().findall('u:settings', NS):
              which = settings.get('pass')
              for component in settings.findall('u:component', NS):
                  name = component.get('name')
                  expected = ORDER.get(name)
                  if not expected:
                      continue
                  seen = [c.tag.split('}')[-1] for c in component]
                  ranks, unknown = [], []
                  for tag in seen:
                      if tag in expected:
                          ranks.append((expected.index(tag), tag))
                      else:
                          unknown.append(tag)
                  if unknown:
                      failures.append(
                          f"{which}/{name}: element(s) not in the known schema "
                          f"order list: {unknown} — extend the list in build.yml")
                  for (a, ta), (b, tb) in zip(ranks, ranks[1:]):
                      if a > b:
                          failures.append(
                              f"{which}/{name}: <{ta}> must come after <{tb}>; "
                              f"Setup will reject this answer file")

          for line in failures:
              print(f"::error::{line}")
          if failures:
              sys.exit(1)
          print("answer file element order is valid for every checked component")
          PY

          # RunSynchronousCommand/Path is capped at 259 characters. Exceeding it
          # makes Windows reject the WHOLE unattend file -- and it does so at
          # oobeSystem, after the image is applied, so the machine ends up in a
          # "computer restarted unexpectedly" loop rather than failing early.
          # An inline PowerShell one-liner hit 324 characters and shipped.
          python3 - <<'PY2'
          import sys, xml.etree.ElementTree as ET
          NS = {'u': 'urn:schemas-microsoft-com:unattend'}
          # 259 is the documented ceiling for RunSynchronousCommand/Path. Whether
          # FirstLogonCommands/CommandLine shares it is not something I could
          # confirm, so it gets a looser bound -- enough to catch an inlined
          # script without failing a release over a guess. Both are kept short in
          # practice by delegating to Stage.cmd / Launch.cmd.
          LIMITS = {'Path': 259, 'CommandLine': 1024}
          bad = []
          for node in ET.parse('/tmp/autounattend.xml').getroot().iter():
              tag = node.tag.split('}')[-1]
              limit = LIMITS.get(tag)
              if limit and (node.text or ''):
                  n = len(node.text.strip())
                  if n > limit:
                      bad.append(f"<{tag}> is {n} chars (limit {limit}): "
                                 f"{node.text.strip()[:80]}...")
          for line in bad:
              print(f"::error::{line}")
          if bad:
              sys.exit(1)
          print("all command strings are within their length limits")
          PY2

          # Stage.cmd does the payload staging the answer file used to inline.
          for helper in Stage Launch; do
            grep -q "${helper}.cmd" /tmp/autounattend.xml \
              || { echo "::error::answer file never calls ${helper}.cmd"; exit 1; }
            test -f "Shared/payload/${helper}.cmd" \
              || { echo "::error::Shared/payload/${helper}.cmd is missing"; exit 1; }
          done

          # Provision.ps1 schedules JoinWifi.ps1 by path when a machine has no
          # wireless interface yet. A missing file would only surface on a
          # technician's bench, and only on the machines that need it most.
          test -f "Shared/payload/JoinWifi.ps1" \
            || { echo "::error::Shared/payload/JoinWifi.ps1 is missing"; exit 1; }
          grep -q "JoinWifi.ps1" Shared/payload/Provision.ps1 \
            || { echo "::error::Provision.ps1 never references JoinWifi.ps1"; exit 1; }

          # A <ProductKey> in the answer file overrides the OEM key in the PC's
          # firmware, which is what left machines showing "Activate Windows" until
          # somebody opened Settings by hand. The default template must not write
          # one; an operator choosing a MAK or KMS key is a separate, deliberate act.
          if grep -q '<ProductKey>' /tmp/autounattend.xml; then
            echo "::error::the default template writes a <ProductKey>, which blocks OEM activation"
            exit 1
          fi
          echo "no product key in the default answer file, so the firmware key wins"

          # The payload config is what Provision.ps1 parses.
          "$BIN" --emit-payload-config > /tmp/config.json
          python3 -c "import json,sys; json.load(open('/tmp/config.json'))"
          echo "payload config is valid JSON"

          # Provisioning's activation step reads this; a rename would silently
          # turn activation off rather than fail.
          python3 -c "
          import json, sys
          system = json.load(open('/tmp/config.json'))['system']
          mode = system.get('activation', {}).get('mode')
          if mode != 'automatic':
              print(f'::error::payload config activation.mode is {mode!r}, expected \'automatic\'')
              sys.exit(1)
          print('payload config carries the activation settings')
          "

      - name: Read app version
        id: version
        run: |
          version=$(sed -n 's/.*marketing = "\([^"]*\)".*/\1/p' Sources/ImageHub/Support/AppVersion.swift)
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: ImageHub-dmg
          path: dist/*.dmg
          if-no-files-found: error

      - name: Upload app bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: ImageHub-app-universal
          path: dist/*.zip
          if-no-files-found: error

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release)
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dmg
            dist/*.zip
          generate_release_notes: true
          # On tag pushes, release under that tag; on manual dispatch, create
          # the tag v<app version> at the built commit.
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', steps.version.outputs.version) }}
