name: Build

on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a GitHub Release (tagged v<app version>) from this run"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

# Both apps are built from every push, and a release carries both. They read the same
# template format, generate the same media and check the same GitHub release for
# updates, so they have to be built and verified together — a change that only makes
# sense on one platform should fail here rather than at a technician's bench.
jobs:
  # Everything that needs neither a Mac nor a Windows machine, first, so a typo in a
  # provisioning script or a drifted app catalog fails in a minute rather than twenty.
  checks:
    name: Repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Check the provisioning scripts are ASCII with a BOM
        run: |
          set -euo pipefail

          # Windows PowerShell 5.1 -- which is what actually runs Provision.ps1 on a
          # target machine -- decodes a BOM-less file as Windows-1252, not UTF-8. An em
          # dash (E2 80 94) then becomes three CP1252 characters, the last of which is a
          # curly closing quote, and PowerShell treats curly quotes as string
          # delimiters. That opened a phantom string, swallowed the braces, and produced
          # "Missing closing '}'" on a script that parses perfectly under PowerShell 7.
          # Requiring a BOM *and* plain ASCII closes both halves of that trap.
          fail=0
          for f in Shared/payload/*.ps1 Windows/*.ps1; do
            if [ "$(head -c 3 "$f" | od -An -tx1 | tr -d ' \n')" != "efbbbf" ]; then
              echo "::error file=$f::missing UTF-8 BOM; Windows PowerShell 5.1 will decode it as ANSI"
              fail=1
            fi
            # tail -c +4 skips the BOM itself, which is of course non-ASCII.
            if tail -c +4 "$f" | LC_ALL=C grep -qn '[^ -~'"$(printf '\t')"']'; then
              echo "::error file=$f::contains non-ASCII characters"
              tail -c +4 "$f" | LC_ALL=C grep -n '[^ -~'"$(printf '\t')"']' | head -5
              fail=1
            fi
          done
          [ "$fail" -eq 0 ] || exit 1
          echo "all payload scripts are ASCII with a UTF-8 BOM"

      - name: Parse the provisioning scripts
        shell: pwsh
        run: |
          $bad = 0
          foreach ($f in Get-ChildItem -Recurse -Filter *.ps1 -Path Shared, Windows) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $f.FullName, [ref]$null, [ref]$errors) | Out-Null
            if ($errors) {
              Write-Host "::error file=$($f.FullName)::$($errors[0].Message)"
              $bad = 1
            } else { Write-Host "ok: $($f.Name)" }
          }
          exit $bad

      - name: Check the app catalogs agree
        run: python3 scripts/check_catalog_parity.py

      # A malformed .csproj fails at project load, so the Windows job reports that one
      # XML complaint and compiles nothing. Catching it here costs seconds and surfaces
      # every such mistake at once.
      - name: Check the XML is well-formed
        run: python3 scripts/check_xml.py

      # The XAML markup compiler needs Windows and stops at the first bad trigger
      # target, so each one otherwise costs a full Windows run to find.
      - name: Check the XAML trigger targets resolve
        run: python3 scripts/check_xaml_targets.py

  # wimlib-imagex is bundled so splitting an oversized install.wim needs no Homebrew on
  # the Mac that builds drives. Windows needs no equivalent: DISM does the split.
  #
  # One job on one runner, deliberately. The obvious shape — a matrix with an Intel
  # runner for x86_64 — does not work any more: macos-13 sits queued indefinitely,
  # `timeout-minutes` only starts counting once a job gets a runner, and the app build
  # waits behind it. So arm64 is built natively and x86_64 is cross-compiled here, with
  # cross-compilation allowed to fail.
  wimlib:
    name: Build wimlib
    runs-on: macos-14
    timeout-minutes: 25
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install autotools
        run: brew install autoconf automake libtool pkg-config

      - name: Build for arm64
        run: ./scripts/build_wimlib.sh "$RUNNER_TEMP/wimlib" arm64

      - name: Build for x86_64
        id: intel
        continue-on-error: true
        run: ./scripts/build_wimlib.sh "$RUNNER_TEMP/wimlib" x86_64

      - name: Note a missing Intel slice
        if: steps.intel.outcome != 'success'
        run: echo "::warning::x86_64 cross-compile failed; Intel Macs will fall back to Homebrew."

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: wimlib
          path: ${{ runner.temp }}/wimlib/
          if-no-files-found: error

  macos:
    name: Build macOS app + DMG
    runs-on: macos-14
    needs: [wimlib]
    timeout-minutes: 40
    # A wimlib failure must not block the app: it falls back to finding Homebrew's copy
    # at runtime, so the release still ships.
    if: always()
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Download wimlib
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: wimlib
          path: wimlib

      - name: Stage wimlib into the bundle
        run: |
          set -euo pipefail
          arm="wimlib/wimlib-imagex-arm64"
          intel="wimlib/wimlib-imagex-x86_64"
          mkdir -p vendor/bin vendor/wimlib

          if [ -f "$arm" ] && [ -f "$intel" ]; then
            lipo -create "$arm" "$intel" -output vendor/bin/wimlib-imagex
          elif [ -f "$arm" ]; then
            echo "::warning::arm64 wimlib only; Intel Macs will fall back to Homebrew."
            cp "$arm" vendor/bin/wimlib-imagex
          elif [ -f "$intel" ]; then
            echo "::warning::x86_64 wimlib only; Apple Silicon will fall back to Homebrew."
            cp "$intel" vendor/bin/wimlib-imagex
          else
            echo "::warning::No wimlib binary available; the app will look for Homebrew's copy."
            exit 0
          fi

          chmod +x vendor/bin/wimlib-imagex
          lipo -info vendor/bin/wimlib-imagex
          cp wimlib/COPYING vendor/wimlib/COPYING 2>/dev/null || true
          cp wimlib/VERSION vendor/wimlib/VERSION 2>/dev/null || true

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Build app, zip, and DMG
        run: ./scripts/make_app.sh

      # make_app.sh redraws Resources/icon_1024.png from the SF Symbol the app itself
      # displays. That needs macOS, so it can only happen here — and the README renders
      # that same file straight out of the repo. Push it back when it changes, otherwise
      # the picture in the README is whatever was committed by hand the last time
      # somebody guessed at the shape. The render is deterministic, so this settles after
      # one commit instead of looping.
      - name: Commit the regenerated icon
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        # Never fail a release over the README's picture.
        continue-on-error: true
        run: |
          set -euo pipefail
          if git diff --quiet -- Resources/icon_1024.png; then
            echo "icon is unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Resources/icon_1024.png
          git commit -m "Regenerate the app icon from the in-app symbol"
          git push origin HEAD:main

      - name: Emit the generated artifacts
        run: |
          set -euo pipefail
          mkdir -p generated
          BIN="dist/ImageHub.app/Contents/MacOS/ImageHub"
          "$BIN" --emit-answer-file   > generated/autounattend.xml
          "$BIN" --emit-office-config > generated/office.xml
          "$BIN" --emit-payload-config > generated/config.json
          wc -c generated/*

      - name: Verify the generated artifacts
        run: python3 scripts/verify_generated.py
          generated/autounattend.xml generated/office.xml generated/config.json

      - name: Read app version
        id: version
        run: |
          version=$(sed -n 's/.*marketing = "\([^"]*\)".*/\1/p' Sources/ImageHub/Support/AppVersion.swift)
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: ImageHub-dmg
          path: dist/*.dmg
          if-no-files-found: error

      - name: Upload app bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: ImageHub-app-universal
          path: dist/*.zip
          if-no-files-found: error

      - name: Upload the generated artifacts
        uses: actions/upload-artifact@v4
        with:
          name: generated-macos
          path: generated/
          if-no-files-found: error

  windows:
    name: Build Windows app + EXE
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Show toolchain
        run: dotnet --info

      - name: Read app version
        id: version
        shell: bash
        run: |
          version=$(sed -n 's/.*marketing = "\([^"]*\)".*/\1/p' Sources/ImageHub/Support/AppVersion.swift)
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "ImageHub ${version}"

      # One self-contained single file, so there is no runtime to install and the in-app
      # updater has exactly one thing to swap. The publish settings live in the csproj;
      # only the configuration is passed here.
      - name: Publish ImageHub.exe
        run: dotnet publish Windows/App/ImageHub.csproj -c Release -o publish

      - name: Name the release files
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          mkdir -p dist
          cp publish/ImageHub.exe "dist/ImageHub-${version}-win-x64.exe"
          (cd dist && 7z a -tzip "ImageHub-${version}-win-x64.zip" "ImageHub-${version}-win-x64.exe" >/dev/null)
          ls -l dist

      # A GUI-subsystem program does not keep the shell waiting, so the --emit-* modes
      # have to be run through Start-Process with the output redirected. Nothing here
      # touches WPF: App.xaml.cs's Main handles these before an Application exists.
      - name: Emit the generated artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path generated | Out-Null
          $exe = "publish/ImageHub.exe"
          function Emit($argument, $target) {
            $process = Start-Process -FilePath $exe -ArgumentList $argument -Wait -NoNewWindow `
              -RedirectStandardOutput $target -RedirectStandardError "generated/stderr.txt" -PassThru
            if ($process.ExitCode -ne 0) {
              Get-Content "generated/stderr.txt" | Write-Host
              throw "$exe $argument exited with $($process.ExitCode)"
            }
          }
          Emit "--emit-answer-file"    "generated/autounattend.xml"
          Emit "--emit-office-config"  "generated/office.xml"
          Emit "--emit-payload-config" "generated/config.json"
          Emit "--version"             "generated/version.txt"
          Remove-Item "generated/stderr.txt" -ErrorAction SilentlyContinue
          Get-ChildItem generated | Format-Table Name, Length

      # ImageHub.csproj reads the version out of the macOS app's AppVersion.swift so
      # there is one version for both platforms. If that ever stops working, the update
      # check would compare against the wrong number — so it is asserted rather than
      # trusted.
      - name: Check the version stamped into the exe
        shell: bash
        run: |
          set -euo pipefail
          stamped=$(tr -d '\r\n' < generated/version.txt)
          expected="${{ steps.version.outputs.version }}"
          if [ "$stamped" != "$expected" ]; then
            echo "::error::ImageHub.exe reports version '${stamped}' but AppVersion.swift says '${expected}'"
            exit 1
          fi
          echo "ImageHub.exe reports ${stamped}, matching AppVersion.swift"

      - name: Verify the generated artifacts
        shell: bash
        run: python scripts/verify_generated.py
          generated/autounattend.xml generated/office.xml generated/config.json

      # The .exe carries Shared/payload as embedded resources. If that ever stops
      # working the app builds and runs, and then fails on a drive with no
      # Provision.ps1 — so the list is checked here.
      - name: Check the payload rode along inside the exe
        shell: pwsh
        run: |
          $listed = & {
            $target = "generated/payload.txt"
            $process = Start-Process -FilePath "publish/ImageHub.exe" -ArgumentList "--list-payload" `
              -Wait -NoNewWindow -RedirectStandardOutput $target -PassThru
            if ($process.ExitCode -ne 0) { throw "--list-payload exited with $($process.ExitCode)" }
            Get-Content $target | Where-Object { $_.Trim() -ne "" }
          }
          $expected = Get-ChildItem Shared/payload -File | ForEach-Object { $_.Name }
          $missing = $expected | Where-Object { $listed -notcontains $_ }
          if ($missing) {
            Write-Host "::error::ImageHub.exe is missing embedded payload files: $($missing -join ', ')"
            exit 1
          }
          Write-Host "all $($expected.Count) payload files are embedded in ImageHub.exe"

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: ImageHub-windows-exe
          path: dist/*.exe
          if-no-files-found: error

      - name: Upload zipped EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: ImageHub-windows-zip
          path: dist/*.zip
          if-no-files-found: error

      - name: Upload the generated artifacts
        uses: actions/upload-artifact@v4
        with:
          name: generated-windows
          path: generated/
          if-no-files-found: error

  # The README promises a drive built on Windows is interchangeable with one built on a
  # Mac. This is what makes that true rather than hoped for: both apps generated the
  # answer file, the Office configuration and the payload config from the same built-in
  # template, and here the two sets are compared.
  parity:
    name: Same media from both apps
    runs-on: ubuntu-latest
    needs: [macos, windows]
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Download the macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: generated-macos
          path: generated-macos

      - name: Download the Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: generated-windows
          path: generated-windows

      - name: Compare
        run: python3 scripts/compare_generated.py generated-macos generated-windows

  release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: [checks, macos, windows, parity]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release)
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Read app version
        id: version
        run: |
          version=$(sed -n 's/.*marketing = "\([^"]*\)".*/\1/p' Sources/ImageHub/Support/AppVersion.swift)
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Download the build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect the release files
        run: |
          set -euo pipefail
          mkdir -p release
          find artifacts -type f \( -name '*.dmg' -o -name '*.exe' -o -name '*.zip' \) \
            -exec cp {} release/ \;
          ls -l release
          # A release that quietly carried only one platform's build would send every
          # user of the other one to a download that isn't there.
          test -n "$(find release -name '*.dmg' -print -quit)" \
            || { echo "::error::no macOS DMG in the release"; exit 1; }
          test -n "$(find release -name '*win-x64.exe' -print -quit)" \
            || { echo "::error::no Windows EXE in the release"; exit 1; }

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          # On tag pushes, release under that tag; on manual dispatch, create the tag
          # v<app version> at the built commit.
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', steps.version.outputs.version) }}
